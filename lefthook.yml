# Lefthook configuration for linting and formatting
# https://github.com/evilmartians/lefthook

# Global settings
fail: pipe
parallel: true
verbose: false

# Pre-commit hook group - auto-fix mode
# Runs locally before commits, modifies files in-place and re-stages them
pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      description: "Format Python files with ruff"
      run: ruff format --line-length 88 {staged_files}
      stage_fixed: true
    ruff-lint:
      glob: "*.py"
      description: "Lint Python files with ruff"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    mdformat:
      glob: "*.md"
      description: "Format Markdown files with mdformat"
      run: mdformat {staged_files}
      stage_fixed: true
    yamlfmt:
      glob: "*.{yaml,yml}"
      description: "Format YAML files with yamlfmt"
      run: yamlfmt --in-place {staged_files}
      stage_fixed: true
    json-tool:
      glob: "*.json"
      description: "Format JSON files with python json.tool"
      run: python -c "import json, sys; [exec(f\"import json; d=json.load(open({repr(f)})); open({repr(f)},\\\"w\\\").write(json.dumps(d,indent=2)+\\\"\\\\n\\\")\") for f in sys.argv[1:]]" {staged_files}
      stage_fixed: true
    zizmor:
      glob: ".github/workflows/*.{yaml,yml}"
      description: "Scan GitHub Actions workflows for security issues with zizmor"
      run: zizmor {staged_files}
      stage_fixed: false

# Lint-all group - check mode
# Used for CI and manual audits, runs in check-only mode
lint-all:
  parallel: true
  commands:
    ruff-format-check:
      glob: "*.py"
      description: "Check Python format with ruff"
      run: ruff format --check --line-length 88 {files}
    ruff-lint-check:
      glob: "*.py"
      description: "Check Python linting with ruff"
      run: ruff check {files}
    mdformat-check:
      glob: "*.md"
      description: "Check Markdown format with mdformat"
      run: mdformat --check {files}
    yamlfmt-check:
      glob: "*.{yaml,yml}"
      description: "Check YAML format with yamlfmt"
      run: yamlfmt {files}
    json-tool-check:
      glob: "*.json"
      description: "Check JSON format with python json.tool"
      run: python -c "import sys, json; [json.load(open(f)) for f in sys.argv[1:]]" {files}
    actionlint:
      glob: ".github/workflows/*.{yaml,yml}"
      description: "Lint GitHub Actions workflows with actionlint"
      run: actionlint {files}
    zizmor-check:
      glob: ".github/workflows/*.{yaml,yml}"
      description: "Scan GitHub Actions workflows for security issues with zizmor"
      run: zizmor {files}

