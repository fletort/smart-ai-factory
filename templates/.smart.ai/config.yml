specifications:
  templates:
    # Main technical document (constitution)
    main_technical_document: .smart.ai/templates/main-spec.md
    # This template can be used when your template contains functional and technical part in one
    # unique document
    unified: .smart.ai/templates/unified-spec.md
    # Alternative modular mode:
    # functional: .smart.ai/templates/functional-spec.md
    # technical: .smart.ai/templates/technical-spec.md
  paths:
    main_technical_document: doc/architecture.md
    main_functional_document: README.md
    unified_spec_path: docs/specs
    functional_spec_path: docs/specs
    technical_spec_path: docs/specs

roadmap:
  versioned: false # Put to true to generate Versioned Directory<br/>roadmap/vX.Y/...
  layout: auto # can be single, multi or auto


