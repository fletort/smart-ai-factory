# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: 'Test Skills'

prompts:
  - file://../configs/prompts/prompt.js

providers:
  - id: file://../configs/providers/geminiOpenAiProvider.js
    label: gemini
    config:
      model: 'google:gemini-3.6-flash'
      apiKey: '{{ env.TEST_GEMINI_API_KEY }}'
      tools: file://../configs/tools.yml
  - id: openrouter:deepseek/deepseek-v4.1-flash
    config:
      apiKey: '{{ env.TEST_OPENROUTER_KEY }}'
      tools: file://../configs/tools.yml
      showThinking: false
      max_tokens: 8000
  # - id: openrouter:google/gemini-3.6-flash
  #   config:
  #     apiKey: '{{ env.TEST_OPENROUTER_KEY }}'
  #     tools: *tools
  #     showThinking: false
  #     max_tokens: 8000
  # - id: openrouter:free
  #   config:
  #     apiKey: '{{ env.TEST_OPENROUTER_KEY }}'

defaultTest:
  vars:
    skill_prompt: file://../../../.agents/skills/smart-spec/SKILL.md
  options:
    provider: openrouter:deepseek/deepseek-v4.1-flash

tests:
  - file://../configs/tests/read_config_first.yml

  - description: Test Skill detects small scope and ask for the corresponding next steps
    providers:
      - gemini
      - openrouter:*
    vars:
      user_message: |
        I just want to make a new minimalist html page with 'Hello World' on it.
        The file name is 'index.html' and located at the root of the workspace.
        No CSS is needed. It is a simple and easy task.
        It should be considered as a SMALL scope.
      read_file_config_result: 'specifications:\ntemplates:\n unified:".templates/unified_spec.md'
      prompt_path: 02-get_config.chat.json
    assert:
      - type: contains
        value: 'SMALL'
      - type: contains-any
        value: ['Case 1', 'Case 2', 'Case 3', '@xs_coder']
      - type: llm-rubric
        value: |
          The output must explicitly engage in a conversation or guide the user towards an immediate action track for a SMALL scope.
          It should ask a question or present choices (Case 1, Case 2, Case 3).

  - description: Test Skill does not evaluate scope (or LARGE) and detect UNIFIED template mode
    providers:
      - gemini
      - openrouter:*
    vars:
      user_message: I want a specification for a complex interest-free 3-installment payment system.
      read_file_config_result: 'specifications:\ntemplates:\n unified:".templates/unified_spec.md'
      prompt_path: 02-get_config.chat.json
    assert:
      - type: contains
        value: 'PENDING'
      - type: contains-all
        value: ['UNIFIED', 'unified_spec.md']
      - type: not-contains
        value: 'MODULAR'
      - type: contains-any
        value:
          - 'not yet evaluated'
          - LARGE
      - type: llm-rubric
        value: |
          The output must draft a specification for a complex interest-free 3-installment payment system.
          Some points of the specification MUST be in PENDING state. To help to close these points,
          maximum of 3 high-impact questions MUST be asked at the end of the prompt.
          The specification scope is not yet evaluated or evaluated as LARGE.

  - description: Test Skill does not evaluate scope (or LARGE) and detect MODULAR template mode
    providers:
      - gemini
      - openrouter:*
    vars:
      user_message: I want a specification for a complex interest-free 3-installment payment system.
      read_file_config_result:
        'specifications:\ntemplates:\n functional: .templates/functional_spec.md\ntechnical:
        .templates/technical_spec.md'
      prompt_path: 02-get_config.chat.json
    assert:
      - type: contains
        value: 'PENDING'
      - type: contains-all
        value: ['MODULAR', 'functional_spec.md', 'technical_spec.md']
      - type: not-contains
        value: 'UNIFIED'
      - type: contains-any
        value:
          - 'not yet evaluated'
          - LARGE
      - type: llm-rubric
        value: |
          The output must draft a specification for a complex interest-free 3-installment payment system.
          Some points of the specification MUST be in PENDING state. To help to close these points,
          maximum of 3 high-impact questions MUST be asked at the end of the prompt.
          The specification scope is not yet evaluated or evaluated as LARGE.

  - description: Test Skill reads the template when spec is ready
    providers:
      - gemini
      - openrouter:*
    vars:
      user_message: I want a specification for a complex interest-free 3-installment payment system.
      read_file_config_result: 'specifications:\ntemplates:\n unified:".templates/unified_spec.md'
      llm_spec_draft_msg: 'Draft ⚠️ [PENDING]. Questions: 1. Gateway? 2. Minimum amount?'
      user_close_draft_msg:
        '1. Stripe. 2. 50€. Everything is clear, you can generate the final spec document now.'
      prompt_path: ../../smart-spec/prompts/03-get_spec.chat.json
    assert:
      - type: is-json
      - type: contains
        value: 'read_file'
      - type: contains
        value: '.templates/unified_spec.md'

  # TODO: Test when template is not available
  - description: Test Skill writes specification and index when spec is validated
    providers:
      - gemini
      - openrouter:*
    vars:
      prompt_path: ../../smart-spec/prompts/04.chat.json
      user_message: I want a specification for a complex interest-free 3-installment payment system.
      read_file_config_result: 'specifications:\ntemplates:\n unified:".templates/unified_spec.md'
      llm_spec_draft_msg: 'Draft ⚠️ [PENDING]. Questions: 1. Gateway? 2. Minimum amount?'
      user_close_draft_msg:
        '1. Stripe. 2. 50€. Everything is clear, you can generate the final spec document now.'
      template_file: .templates/unified_spec.md
      read_file_template_file_content: |
        # # Unified Specifications: [Module/Feature Name]
        ## 1. Context & Objectives
        **Global Vision:** [What problem are we solving and why?]
        ## 2. Functional Specifications (What)
        ## 3. Technical Specifications (How)
      index_file: docs/INDEX.md
      read_file_index_result: ''
    assert:
      - type: is-json
      - type: tool-call-f1
        value:
          - write_file
      - type: equals
        value: 'write_file'
        transform: output[0].function?.name || output[0].functionCall?.name
      - type: equals
        value: 'write_file'
        transform: output[1]?.function?.name || output[1]?.functionCall?.name
      - type: equals
        value: true
        transform: |
          const argsFirstCall = output[0].function?.arguments;
          const argsSecondCall = output[1].function?.arguments;
          const pathFirstCall = typeof argsFirstCall === 'string' ? JSON.parse(argsFirstCall).path : argsFirstCall?.path;
          const pathSecondCall = typeof argsSecondCall === 'string' ? JSON.parse(argsSecondCall).path : argsSecondCall?.path;
          return pathFirstCall == 'docs/INDEX.md' || pathSecondCall == 'docs/INDEX.md'
      - type: llm-rubric
        value: |
          Verify that the specifications document meets the following criteria:
          1. It uses Stripe for a 3-installment payment plan.
          2. It enforces a minimum amount of 50€.
          3. This specification can be used to defined tasks to develop the system
        transform: |
          const argsSecondCall = output[1].function?.arguments;
          const pathSecondCall = typeof argsSecondCall === 'string' ? JSON.parse(argsSecondCall).path : argsSecondCall?.path;
          let index = (pathSecondCall == 'docs/INDEX.md') ? 0 : 1;
          const first = output[index];
          if (!first) return '';
          const args = first.function?.arguments;
          return typeof args === 'string' ? JSON.parse(args).content : args?.content;
