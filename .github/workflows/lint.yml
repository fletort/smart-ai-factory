name: Lint All

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Run linting checks

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: latest
          virtualenvs-in-project: true

      - name: Cache Poetry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry sync --no-interaction --no-ansi
          npm install

      - name: Install actionlint
        run: |
          curl -SL -o download-actionlint.sh  https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 
          sudo bash download-actionlint.sh 1.7.12 /usr/bin
          rm download-actionlint.sh

      - name: Run Lefthook lint-all
        run: |
          eval "$(poetry env activate)"
          .github/scripts/lefthook-summary.sh >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
