[project]
name = "smart-ai-factory"
version = "0.1.0"
description = "Agnostic AI-DevOps framework that automates and self-regulates the software development lifecycle."
authors = [{ name = "fletort" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
mdformat = ">=0.7.16"
mdformat-gfm = ">=0.3.5"
lefthook = ">=1.5.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501"]  # Line too long is handled by formatter

[tool.mdformat]
number = false
wrap = 88
